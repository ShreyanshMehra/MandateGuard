name: mandateguard

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandateguard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_admin_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-mandateguard}
      BROKER_DB_PASSWORD: ${BROKER_DB_PASSWORD:-dev_broker_change_me}
      BANK_DB_PASSWORD: ${BANK_DB_PASSWORD:-dev_bank_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:1.17.0-static
    command: ["run", "--server", "--addr=:8181", "--log-level=info", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mandateguard_admin}:${POSTGRES_PASSWORD:-dev_admin_change_me}@postgres:5432/${POSTGRES_DB:-mandateguard}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  broker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: services/broker
    environment:
      DATABASE_URL: postgresql+psycopg://mandateguard_broker:${BROKER_DB_PASSWORD:-dev_broker_change_me}@postgres:5432/${POSTGRES_DB:-mandateguard}
      OPA_URL: http://opa:8181
      MOCK_BANK_URL: http://mock-bank:8000
      BROKER_SERVICE_TOKEN: ${BROKER_SERVICE_TOKEN:-dev_broker_service_token_change_me}
      MAX_AGENT_TOKEN_TTL_SECONDS: "300"
      BROKER_PERMIT_KEY_PATH: /secrets/dev/broker-permit-signing__broker-permit-signing_dev-2026-07.pem
      BROKER_PERMIT_KEY_ID: broker-permit-signing:dev-2026-07
      BANK_RESULT_PUBLIC_KEY_B64: ${BANK_RESULT_PUBLIC_KEY_B64:-ZL8O0Hf9/VmFthp2cu+wP/vgrNOUXmicT/dZMMrHN+g=}
      PERMIT_TTL_SECONDS: "60"
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-dev_operator_token_change_me}
      AUDIT_CHECKPOINT_KEY_PATH: /secrets/dev/audit-checkpoint-signing__audit-checkpoint-signing_dev-2026-07.pem
      AUDIT_CHECKPOINT_KEY_ID: audit-checkpoint-signing:dev-2026-07
    volumes:
      - ./secrets/dev:/secrets/dev:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-bank:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: services/mock-bank
    environment:
      DATABASE_URL: postgresql+psycopg://mandateguard_bank:${BANK_DB_PASSWORD:-dev_bank_change_me}@postgres:5432/${POSTGRES_DB:-mandateguard}
      BROKER_SERVICE_TOKEN: ${BROKER_SERVICE_TOKEN:-dev_broker_service_token_change_me}
      BANK_RESULT_KEY_PATH: /secrets/dev/bank-result-signing__bank-result-signing_dev-2026-07.pem
      BANK_RESULT_KEY_ID: bank-result-signing:dev-2026-07
      BROKER_PERMIT_PUBLIC_KEY_B64: ${BROKER_PERMIT_PUBLIC_KEY_B64:-xCi3eN4vtw0KuhpDjQhgq0zdy3jfGXHOUuiGhaHxou0=}
    volumes:
      - ./secrets/dev:/secrets/dev:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # Intentionally not published to the host: the broker is the only
    # caller allowed to reach the mock bank, per docs/ARCHITECTURE.md.

  agent-simulator:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: services/agent-simulator
    environment:
      BROKER_URL: http://broker:8000
    ports:
      - "8100:8000"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BROKER_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
